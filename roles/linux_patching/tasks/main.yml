---
# OS patching. The package manager step is chosen by OS family, so each family's
# commands live in their own file instead of behind when: conditions.

- name: Pre-patch checks
  ansible.builtin.import_tasks: precheck.yml
  tags: [patching, patching_precheck]

# Dynamic include: only one of update_redhat.yml, update_debian.yml, update_suse.yml runs.
- name: Apply updates for this OS family
  ansible.builtin.include_tasks: update_{{ ansible_facts['os_family'] | lower }}.yml
  args:
    apply:
      tags: [patching, patching_update]
  tags: [patching, patching_update]

- name: Reboot if required
  ansible.builtin.import_tasks: reboot.yml
  tags: [patching, patching_reboot]

- name: Report the result
  ansible.builtin.import_tasks: report.yml
  tags: [patching, patching_report]
