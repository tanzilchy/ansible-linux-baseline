---
linux_timesync_os:
  RedHat:
    service: chronyd
    config: /etc/chrony.conf
    driftfile: /var/lib/chrony/drift
  Debian:
    service: chrony
    config: /etc/chrony/chrony.conf
    driftfile: /var/lib/chrony/chrony.drift
linux_timesync_cfg: "{{ linux_timesync_os[ansible_facts['os_family']] }}"
