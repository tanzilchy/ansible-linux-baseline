---
# Time synchronisation with chrony on every supported distribution.

- name: Install chrony and remove competing daemons
  ansible.builtin.import_tasks: install.yml
  tags: [timesync, timesync_install]

- name: Configure chrony
  ansible.builtin.import_tasks: configure.yml
  tags: [timesync, timesync_configure]

- name: Verify chrony has a usable source
  ansible.builtin.import_tasks: verify.yml
  tags: [timesync, timesync_verify]
