---
# Accounts and privilege. Each concern lives in its own file; this file only sets the order.
# Run a single part with its tag, for example: --tags access_sudoers

- name: Password ageing defaults
  ansible.builtin.import_tasks: login_defs.yml
  tags: [access, access_login_defs]

- name: Administrator accounts and keys
  ansible.builtin.import_tasks: admins.yml
  tags: [access, access_admins]

- name: Automation account
  ansible.builtin.import_tasks: automation_user.yml
  tags: [access, access_automation]

# Accounts must exist before sudo rules refer to them.
- name: Sudo rules
  ansible.builtin.import_tasks: sudoers.yml
  tags: [access, access_sudoers]

- name: Root break-glass password
  ansible.builtin.import_tasks: root_password.yml
  tags: [access, access_root]
