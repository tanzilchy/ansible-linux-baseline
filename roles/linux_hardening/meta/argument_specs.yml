---
# Variable contract for this role. Ansible validates the inputs against it before the
# first task runs, and README.md documents the same variables.
argument_specs:
  main:
    short_description: SSH daemon baseline and idle session timeouts.
    options:
      linux_hardening_permit_root_login:
        type: str
        description: '`PermitRootLogin`. Keep `no` once bootstrap has created key-based accounts.'
        choices:
          - 'no'
          - prohibit-password
          - 'yes'
        default: 'no'
      linux_hardening_password_authentication:
        type: str
        description: '`PasswordAuthentication`.'
        choices:
          - 'no'
          - 'yes'
        default: 'no'
      linux_hardening_max_auth_tries:
        type: int
        description: '`MaxAuthTries`.'
        default: 3
      linux_hardening_login_grace_time:
        type: int
        description: '`LoginGraceTime` in seconds.'
        default: 60
      linux_hardening_idle_timeout:
        type: int
        description: Seconds before idle shells and logind sessions are closed.
        default: 300
      linux_hardening_sshd_settings:
        type: dict
        description: Full set of sshd keywords written to the server. Override the whole dictionary to add keywords.
