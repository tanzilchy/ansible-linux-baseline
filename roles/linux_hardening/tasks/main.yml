---
# RHEL 9 and Ubuntu include sshd_config.d/*.conf; RHEL 8 does not. Recent SUSE releases ship
# the defaults in /usr/etc/ssh and have no /etc/ssh/sshd_config at all, only the drop-in directory.
# Detect it instead of guessing from the distribution name.
- name: Read the main sshd config
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config
  register: linux_hardening_sshd_main
  failed_when: false

- name: Decide where the sshd settings go
  ansible.builtin.set_fact:
    linux_hardening_sshd_dropin: >-
      {{ linux_hardening_sshd_main.content is not defined
         or (linux_hardening_sshd_main.content | b64decode) is search('(?mi)^\\s*Include\\s+/etc/ssh/sshd_config\\.d/') }}

- name: Make sure the drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: linux_hardening_sshd_dropin | bool

# Anaconda writes 01-permitrootlogin.conf when root SSH was allowed at install time.
# Our file is named 00-* so it is read first and wins, but the leftover is removed to avoid confusion.
- name: Remove the installer's root login override
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    state: absent
  notify: Reload sshd

- name: Write the sshd baseline drop-in
  ansible.builtin.template:
    src: 00-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/00-baseline.conf
    owner: root
    group: root
    mode: "0600"
  when: linux_hardening_sshd_dropin | bool
  notify: Reload sshd

- name: Set the sshd baseline in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ linux_hardening_sshd_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not linux_hardening_sshd_dropin | bool
  notify: Reload sshd

- name: Close idle shells
  ansible.builtin.copy:
    dest: /etc/profile.d/99-idle-timeout.sh
    content: |
      # Managed by Ansible
      TMOUT={{ linux_hardening_idle_timeout }}
      readonly TMOUT
      export TMOUT
    owner: root
    group: root
    mode: "0644"

- name: Read the systemd version
  ansible.builtin.command: systemctl --version
  register: linux_hardening_systemd
  changed_when: false
  check_mode: false

# StopIdleSessionSec only exists from systemd 252. Older versions ignore it silently,
# which looks like a control that is not there.
- name: Stop idle logind sessions
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?StopIdleSessionSec="
    line: "StopIdleSessionSec={{ linux_hardening_idle_timeout }}"
    insertafter: "^\\[Login\\]"
  when: linux_hardening_systemd.stdout_lines[0].split()[1] | int >= 252
  notify: Restart systemd-logind
