---
# SSH and session hardening. Run after linux_access so key-based logins exist
# before root and password logins are switched off.

- name: SSH daemon baseline
  ansible.builtin.import_tasks: sshd.yml
  tags: [hardening, hardening_sshd]

- name: Idle session timeouts
  ansible.builtin.import_tasks: session_timeout.yml
  tags: [hardening, hardening_timeout]
