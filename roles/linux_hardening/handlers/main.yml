---
# Handlers run in the order written: validate the full config first, then reload.
# A broken config fails the run instead of locking everyone out.
- name: Validate sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload sshd

- name: Reload sshd service
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: reloaded
  listen: Reload sshd

- name: Restart systemd-logind
  ansible.builtin.service:
    name: systemd-logind
    state: restarted
