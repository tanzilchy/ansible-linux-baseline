[defaults]
# Safe default: anyone who clones the repo hits only the example (non-routable) hosts.
# Real environments live outside the repo and are passed explicitly with -i ~/inventories/<env>/hosts.yml.
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ./collections:~/.ansible/collections
interpreter_python = auto_silent

stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks

retry_files_enabled = false
forks = 20
timeout = 30
# Never disable in a committed config: it is what protects against a spoofed host.
host_key_checking = true

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

[privilege_escalation]
become_method = sudo
