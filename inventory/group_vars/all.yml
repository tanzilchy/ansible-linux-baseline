---
ansible_user: ansible

linux_access_admins:
  - name: jdoe
    comment: Jane Doe
    ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyOnlyReplaceMe jdoe@laptop"
    password_hash: "{{ vault_linux_admin_password_hashes['jdoe'] }}"
linux_access_automation_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyOnlyReplaceMe ansible@controller"
linux_access_root_password_hash: "{{ vault_linux_root_password_hash }}"

linux_timesync_servers:
  - ntp1.example.net
  - ntp2.example.net

linux_patching_repo_targets:
  default: { host: mirror.example.net, port: 443 }

linux_log_forwarding_target:
  host: siem.example.net
  port: 514
