---
# SUSE family (SLES 15, openSUSE Leap 15).
bootstrap_user: ec2-user

# SUSE 15 ships Python 3.6 as /usr/bin/python3, which current ansible-core cannot manage.
# bootstrap.yml and setup-suse-vm.yml install python311 automatically (playbooks/tasks/suse_python.yml).
ansible_python_interpreter: /usr/bin/python3.11

# Checked by linux_preflight against the facts, so a misplaced host fails before any change.
linux_preflight_expected_os_family: Suseplaybooks/site.yml