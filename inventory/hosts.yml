---
# Example inventory. Copy this directory outside the repo (for example ~/inventories/lab/)
# and replace the values there. Never put real hosts in this file: it is published.
# Addresses are from the documentation ranges (RFC 5737) and route nowhere.
#
# Hosts are grouped two ways at once:
#   by distribution (rhel, ubuntu, suse) -> how to log in and which Python to use
#   by environment  (uat, prod)          -> how cautiously to change things
# A host belongs to one group of each kind, so "-l 'ubuntu:&prod'" targets Ubuntu in production.
all:
  children:
    linux:
      children:
        rhel:
          hosts:
            rhel-uat-01.example.net:
              ansible_host: 192.0.2.11
            rhel-prod-01.example.net:
              ansible_host: 198.51.100.11
        ubuntu:
          hosts:
            ubuntu-uat-01.example.net:
              ansible_host: 192.0.2.21
            ubuntu-prod-01.example.net:
              ansible_host: 198.51.100.21
        suse:
          hosts:
            suse-uat-01.example.net:
              ansible_host: 192.0.2.31
    uat:
      hosts:
        rhel-uat-01.example.net:
        ubuntu-uat-01.example.net:
        suse-uat-01.example.net:
    prod:
      hosts:
        rhel-prod-01.example.net:
        ubuntu-prod-01.example.net:
