---
# Rolling OS patching. Hosts are patched in batches; one failure stops the rollout
# so a bad update never reaches the whole fleet.
#   ansible-playbook playbooks/patch.yml -l uat -e linux_patching_batch=1
#   ansible-playbook playbooks/patch.yml -l prod -e linux_patching_batch=20%
- name: Patch Linux hosts in batches
  hosts: linux
  become: true
  serial: "{{ linux_patching_batch | default('25%') }}"
  max_fail_percentage: 0
  roles:
    - linux_patching
