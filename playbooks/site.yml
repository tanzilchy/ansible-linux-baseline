---
# Full baseline for every supported OS. Each OS family has its own playbook under os/,
# which runs the same roles plus only what really differs for that family.
#   ansible-playbook -i ~/inventories/<env>/hosts.yml playbooks/site.yml --check --diff   # preview
#   ansible-playbook -i ~/inventories/<env>/hosts.yml playbooks/site.yml
#   ansible-playbook -i ~/inventories/<env>/hosts.yml playbooks/os/ubuntu.yml             # one family
- name: Red Hat family
  ansible.builtin.import_playbook: os/rhel.yml

- name: Debian family
  ansible.builtin.import_playbook: os/ubuntu.yml

- name: SUSE family
  ansible.builtin.import_playbook: os/suse.yml
